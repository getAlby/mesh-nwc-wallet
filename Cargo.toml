[package]
name = "mesh-wallet-nwc"
edition = "2024"
license = "Apache-2.0"
version = "0.1.0"
description = "Nostr Wallet Connect (NIP-47) Lightning wallet plugin for mesh-llm (wallet.v1)"
repository = "https://github.com/getAlby/mesh-nwc-wallet"
readme = "README.md"

[dependencies]
anyhow = "1"
async-trait = "0.1"
mesh-llm-plugin = { git = "https://github.com/Mesh-LLM/mesh-llm", rev = "51fd00a99806afa1bc1db0abbedc5d0702c9900b" }
mesh-llm-wallet = { git = "https://github.com/Mesh-LLM/mesh-llm", rev = "51fd00a99806afa1bc1db0abbedc5d0702c9900b", features = ["plugin-server"] }
nwc = "=0.45.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tracing = "0.1"

[[bin]]
name = "nwc-wallet"
path = "src/main.rs"

[dev-dependencies]
serde_json = "1"
tempfile = "3"
mesh-llm-plugin-manager = { git = "https://github.com/Mesh-LLM/mesh-llm", rev = "51fd00a99806afa1bc1db0abbedc5d0702c9900b" }
flate2 = "1"
tar = "0.4"
tokio = { version = "1", features = ["macros", "rt", "process", "net", "time"] }
